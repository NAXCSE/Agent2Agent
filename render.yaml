services:
  - type: web
    name: agent2agent-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      # Secrets: no `value` here on purpose. Render prompts for these when the
      # Blueprint is applied, so they are never written to git.
      - key: APIFY_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Public configuration, with sensible defaults.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-flash-latest
      - key: LINKEDIN_ACTOR_ID
        value: harvestapi/linkedin-profile-scraper
      - key: INSTAGRAM_ACTOR_ID
        value: apify/instagram-profile-scraper
      # Lock this to your Vercel domain once it exists, e.g.
      #   https://your-app.vercel.app
      - key: CORS_ORIGINS
        value: "*"
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT